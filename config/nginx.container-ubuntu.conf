# HTTP only, reachable by the host's TLS reverse proxy.
limit_req_zone $binary_remote_addr zone=join:10m rate=30r/m;
server {
    listen 127.0.0.1:5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /api/join {
        limit_except POST { deny all; }
        limit_req zone=join burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }
    location = /api/invitations {
        limit_except POST { deny all; }
        limit_req zone=join burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
