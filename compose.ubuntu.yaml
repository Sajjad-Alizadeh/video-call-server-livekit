# Standalone Ubuntu configuration, not an override of compose.yaml.
# Generate production .env / LiveKit config and configure TLS before public use.
name: livekit-node
services:
  livekit:
    image: livekit/livekit-server:v1.13.10
    command: ["--config", "/etc/livekit.yaml"]
    network_mode: host
    volumes:
      - type: bind
        source: ./config/livekit.yaml
        target: /etc/livekit.yaml
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

  backend:
    build: .
    network_mode: host
    env_file: .env
    environment:
      HOST: 127.0.0.1
      PORT: "3000"
      LIVEKIT_URL: http://127.0.0.1:7880
    depends_on:
      livekit:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready',{headers:{authorization:'Bearer '+process.env.BACKEND_API_KEY}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 10s
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  web:
    build: ./examples/react-client
    network_mode: host
    volumes:
      - type: bind
        source: ./config/nginx.container-ubuntu.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
